<div class="eqLogic eqLogic-widget awtrix-widget #custom_layout# #eqLogic_class#" data-eqType="#eqType#" data-eqLogic_id="#id#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width: #width#;height: #height#;#style#">
    <center class="widget-name">
        <span class="warning" title="#alert_name#">
            <i class='#alert_icon#'></i>
        </span>
        <span class="cmd refresh pull-right cursor" data-cmd_id="#refresh_id#">
            <i class="fas fa-sync"></i>
        </span>
        <span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
        <a href="#eqLogic_href#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
    </center>

    <div class="awtrix-card-content">
        <!-- CABECERA: ESTADO Y FIRMWARE -->
        <div class="awtrix-header-row">
            <div class="awtrix-status-badge">#status_display#</div>
            <div class="awtrix-fw-badge">#fw_badge#</div>
        </div>

        <!-- TELEMETRÍA DEL PANEL (solo sensores disponibles) -->
        <div class="awtrix-telemetry-row" style="#telemetry_style#">
            #telemetry_badges#
        </div>

        <!-- APP ACTUAL Y CONTROLES RÁPIDOS DE PANTALLA -->
        <div class="awtrix-display-section">
            <div class="awtrix-app-info" title="{{Aplicación actual en pantalla}}">
                <i class="fas fa-tv" style="color: #F59E0B;"></i>
                <span class="awtrix-current-app" data-cmd_id="#current_app_cmd_id#">#current_app#</span>
            </div>
            <div class="awtrix-display-controls">
                <button type="button" class="btn btn-default btn-circle btn-sm cmd-btn-awtrix" data-cmd_id="#prev_app_id#" title="{{App anterior}}">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button type="button" class="btn btn-warning btn-circle cmd-btn-awtrix #power_btn_class#" data-cmd_id="#toggle_power_id#" title="{{Encender / Apagar pantalla}}">
                    <i class="fas fa-power-off"></i>
                </button>
                <button type="button" class="btn btn-default btn-circle btn-sm cmd-btn-awtrix" data-cmd_id="#dismiss_notif_id#" title="{{Descartar notificación}}">
                    <i class="fas fa-bell-slash"></i>
                </button>
                <button type="button" class="btn btn-default btn-circle btn-sm cmd-btn-awtrix" data-cmd_id="#next_app_id#" title="{{Siguiente app}}">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
        </div>

        <!-- CONTROL DE BRILLO -->
        <div class="awtrix-slider-row" title="{{Brillo de la matriz LED}}">
            <i class="fas fa-sun awtrix-slider-icon"></i>
            <input type="range" class="awtrix-brightness-slider" min="0" max="100" value="#brightness#" data-cmd_id="#set_brightness_id#" />
            <span class="awtrix-slider-val">#brightness#%</span>
        </div>

        <!-- BARRA INTEGRADA DE COMANDO (FILA ÚNICA ESTILO LOVELACE) -->
        <div class="awtrix-quick-action-row awtrix-unified-action-bar">
            <select class="form-control input-sm awtrix-widget-cmd-select" title="{{Seleccionar comando}}">
                #cmd_options#
            </select>
            <div class="awtrix-input-wrapper">
                <input type="text" class="form-control awtrix-input-text" placeholder="{{Texto o JSON de notificación...}}" />
                <select class="form-control awtrix-input-select" style="display: none;"></select>
                <input type="number" class="form-control awtrix-input-slider" min="0" max="100" value="#brightness#" style="display: none;" />
            </div>
            <button type="button" class="btn btn-warning awtrix-btn-run-selected" title="{{Ejecutar comando}}">
                <i class="fas fa-play"></i>
            </button>
            <a href="#eqLogic_href#" class="btn btn-default awtrix-btn-help-link reportModeHidden" title="{{Ayuda, configuración y visualizador}}">
                <i class="fas fa-question-circle"></i>
            </a>
        </div>
    </div>

    <style>
        .awtrix-widget {
            height: auto !important;
            min-height: auto !important;
            background: linear-gradient(145deg, rgba(35, 33, 30, 0.96), rgba(20, 19, 18, 0.98)) !important;
            border-radius: 12px !important;
            border-top: 3px solid #F59E0B !important;
            color: #EAE6DF !important;
            padding: 8px 12px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
        }
        .awtrix-card-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }
        .awtrix-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .awtrix-telemetry-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }
        .awtrix-tel-pill {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.28);
            color: #FCD34D;
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 10.5px;
        }
        .awtrix-display-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }
        .awtrix-app-info {
            font-size: 11px;
            margin-bottom: 5px;
            color: #D6CFC5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .awtrix-display-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .cmd-btn-awtrix {
            border-radius: 50% !important;
            width: 32px;
            height: 32px;
            padding: 0 !important;
            line-height: 32px !important;
        }
        .cmd-btn-awtrix.awtrix-power-on {
            background-color: #F59E0B !important;
            border-color: #F59E0B !important;
            color: #111 !important;
            width: 36px;
            height: 36px;
            line-height: 36px !important;
        }
        .cmd-btn-awtrix.awtrix-power-off {
            background-color: #44403C !important;
            border-color: #57534E !important;
            color: #D6D3D1 !important;
            width: 36px;
            height: 36px;
            line-height: 36px !important;
        }
        .awtrix-slider-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .awtrix-slider-icon {
            color: #F59E0B;
        }
        .awtrix-brightness-slider {
            flex-grow: 1;
            height: 4px;
            accent-color: #F59E0B;
            cursor: pointer;
        }
        .awtrix-slider-val {
            min-width: 34px;
            text-align: right;
            font-weight: bold;
            color: #F59E0B;
        }
        /* BARRA INTEGRADA DE COMANDO (FILA ÚNICA ESTILO LOVELACE) */
        .awtrix-unified-action-bar {
            display: flex !important;
            align-items: stretch !important;
            height: 28px !important;
            background: rgba(0, 0, 0, 0.35) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            border-radius: 6px !important;
            overflow: hidden !important;
            margin-top: 4px !important;
            box-sizing: border-box !important;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .awtrix-unified-action-bar:focus-within {
            border-color: rgba(245, 158, 11, 0.6) !important;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.25) !important;
        }
        .awtrix-unified-action-bar .awtrix-widget-cmd-select {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            background: rgba(255, 255, 255, 0.07) !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F59E0B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 6px center !important;
            background-size: 10px 10px !important;
            border: none !important;
            border-right: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 0 !important;
            color: #EAE6DF !important;
            font-size: 11px !important;
            font-weight: 500 !important;
            height: 100% !important;
            line-height: 26px !important;
            padding: 0 18px 0 8px !important;
            cursor: pointer !important;
            max-width: 95px !important;
            min-width: 75px !important;
            flex-shrink: 0 !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            box-shadow: none !important;
        }
        .awtrix-unified-action-bar .awtrix-widget-cmd-select option {
            background: #1c1917;
            color: #FFF;
        }
        .awtrix-unified-action-bar .awtrix-input-wrapper {
            flex: 1 1 auto !important;
            min-width: 0 !important;
            display: flex !important;
            align-items: stretch !important;
            height: 100% !important;
        }
        .awtrix-unified-action-bar .form-control.awtrix-input-text,
        .awtrix-unified-action-bar .form-control.awtrix-input-slider {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            color: #FFF !important;
            font-size: 11px !important;
            height: 100% !important;
            padding: 0 8px !important;
            box-shadow: none !important;
            outline: none !important;
            width: 100% !important;
        }
        .awtrix-unified-action-bar .form-control.awtrix-input-text::placeholder {
            color: rgba(255, 255, 255, 0.4) !important;
            font-style: italic;
        }
        .awtrix-unified-action-bar .form-control.awtrix-input-text:disabled {
            background: rgba(255, 255, 255, 0.02) !important;
            color: rgba(255, 255, 255, 0.35) !important;
            cursor: not-allowed;
        }
        .awtrix-unified-action-bar .form-control.awtrix-input-select {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            background: transparent !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F59E0B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 6px center !important;
            background-size: 10px 10px !important;
            border: none !important;
            border-radius: 0 !important;
            color: #FFF !important;
            font-size: 11px !important;
            height: 100% !important;
            padding: 0 20px 0 8px !important;
            box-shadow: none !important;
            outline: none !important;
            width: 100% !important;
            cursor: pointer !important;
        }
        .awtrix-unified-action-bar .form-control.awtrix-input-select option {
            background: #1c1917;
            color: #FFF;
        }
        .awtrix-unified-action-bar .awtrix-btn-run-selected {
            background: rgba(245, 158, 11, 0.22) !important;
            border: none !important;
            border-left: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 0 !important;
            color: #F59E0B !important;
            font-size: 11px !important;
            height: 100% !important;
            width: 28px !important;
            padding: 0 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            flex-shrink: 0 !important;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .awtrix-unified-action-bar .awtrix-btn-run-selected:hover {
            background: #F59E0B !important;
            color: #1C1917 !important;
        }
        .awtrix-unified-action-bar .awtrix-btn-help-link {
            background: transparent !important;
            border: none !important;
            border-left: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 0 !important;
            color: rgba(255, 255, 255, 0.35) !important;
            font-size: 11px !important;
            height: 100% !important;
            width: 22px !important;
            padding: 0 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            flex-shrink: 0 !important;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .awtrix-unified-action-bar .awtrix-btn-help-link:hover {
            color: #F59E0B !important;
            background: rgba(245, 158, 11, 0.12) !important;
        }
    </style>

    <script>
        (function() {
            var $widget = $('.awtrix-widget[data-eqLogic_id=#id#]');

            function syncAwtrixWidgetCmdInput() {
                var $opt = $widget.find('.awtrix-widget-cmd-select option:selected');
                var sub = $opt.attr('data-subtype') || 'other';
                var ph = $opt.attr('data-placeholder') || '';
                var optsRaw = $opt.attr('data-options') || '';
                var $txt = $widget.find('.awtrix-input-text');
                var $selOpt = $widget.find('.awtrix-input-select');
                var $sld = $widget.find('.awtrix-input-slider');
                $txt.hide();
                $selOpt.hide().empty();
                $sld.hide();

                if (optsRaw) {
                    try {
                        var parsed = JSON.parse(optsRaw);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            parsed.forEach(function(item) {
                                $selOpt.append($('<option></option>').val(item.value).text(item.label));
                            });
                            $selOpt.show();
                            return;
                        }
                    } catch (e) {}
                }

                if (sub === 'message') {
                    $txt.prop('disabled', false).attr('placeholder', ph || '...').val('').show();
                } else if (sub === 'slider') {
                    $sld.show();
                } else {
                    $txt.prop('disabled', true).attr('placeholder', ph ? ('— ' + ph + ' —') : '—').val('').show();
                }
            }

            syncAwtrixWidgetCmdInput();

            $widget.find('.awtrix-widget-cmd-select').off('change').on('change', function() {
                syncAwtrixWidgetCmdInput();
            });

            // Botón de refresco con animación de giro y actualización en vivo
            $widget.find('.cmd.refresh').off('click').on('click', function() {
                var $icon = $(this).find('i');
                $icon.addClass('fa-spin');
                if ('#refresh_id#') {
                    jeedom.cmd.execute({
                        id: '#refresh_id#',
                        success: function() {
                            setTimeout(function() { $icon.removeClass('fa-spin'); }, 800);
                        },
                        error: function() {
                            $icon.removeClass('fa-spin');
                        }
                    });
                }
            });

            // Botones de control de pantalla (siguiente/anterior app, encendido, descartar)
            $widget.find('.cmd-btn-awtrix').off('click').on('click', function() {
                var cmdId = $(this).attr('data-cmd_id');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId});
                    // Tras cambiar de app o pulsar encendido, consultar el nuevo estado a los 600ms
                    var isNav = (cmdId == '#next_app_id#' || cmdId == '#prev_app_id#' || cmdId == '#toggle_power_id#');
                    if (isNav && '#refresh_id#') {
                        setTimeout(function() {
                            jeedom.cmd.execute({id: '#refresh_id#'});
                        }, 600);
                    }
                }
            });

            // Listener de eventos en tiempo real de Jeedom (actualiza la app y estados sin recargar)
            $('body').off('jeedom::cmd::update.awtrix#id#').on('jeedom::cmd::update.awtrix#id#', function(_event, _options) {
                if (_options.cmd_id == '#current_app_cmd_id#') {
                    var appName = _options.display_value || _options.value || '';
                    $widget.find('.awtrix-current-app').text(appName || '{{Reloj / Carrusel}}');
                }
                if (_options.cmd_id == '#brightness_state_cmd_id#') {
                    var bVal = parseInt(_options.display_value || _options.value, 10);
                    if (!isNaN(bVal)) {
                        $widget.find('.awtrix-brightness-slider').val(bVal);
                        $widget.find('.awtrix-slider-val').text(bVal + '%');
                    }
                }
                if (_options.cmd_id == '#power_state_cmd_id#') {
                    var pVal = parseInt(_options.display_value || _options.value, 10);
                    var $pBtn = $widget.find('[data-cmd_id="#toggle_power_id#"]');
                    if (pVal === 1) {
                        $pBtn.removeClass('awtrix-power-off').addClass('awtrix-power-on');
                    } else {
                        $pBtn.removeClass('awtrix-power-on').addClass('awtrix-power-off');
                    }
                }
            });

            $widget.find('.awtrix-brightness-slider').off('change').on('change', function() {
                var cmdId = $(this).attr('data-cmd_id');
                var val = $(this).val();
                $(this).siblings('.awtrix-slider-val').text(val + '%');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId, value: {slider: val}});
                }
            });

            function runSelectedAwtrixWidgetCmd() {
                var $opt = $widget.find('.awtrix-widget-cmd-select option:selected');
                var cmdId = $opt.val();
                var sub = $opt.attr('data-subtype') || 'other';
                if (!cmdId) return;

                var $selOpt = $widget.find('.awtrix-input-select');
                if ($selOpt.is(':visible')) {
                    var optVal = $selOpt.val();
                    if (!optVal) return;
                    jeedom.cmd.execute({id: cmdId, value: {title: '', message: optVal}});
                } else if (sub === 'message') {
                    var $txt = $widget.find('.awtrix-input-text');
                    var text = $txt.val().trim();
                    if (!text) return;
                    jeedom.cmd.execute({id: cmdId, value: {title: '', message: text}});
                    $txt.val('');
                } else if (sub === 'slider') {
                    var sVal = $widget.find('.awtrix-input-slider').val();
                    jeedom.cmd.execute({id: cmdId, value: {slider: sVal}});
                } else {
                    jeedom.cmd.execute({id: cmdId});
                }
            }

            $widget.find('.awtrix-btn-run-selected').off('click').on('click', runSelectedAwtrixWidgetCmd);
            $widget.find('.awtrix-input-text').off('keypress').on('keypress', function(e) {
                if (e.which === 13) {
                    e.preventDefault();
                    runSelectedAwtrixWidgetCmd();
                }
            });

            // Ajustar altura automáticamente al contenido y refrescar el grid de Jeedom si aplica
            setTimeout(function() {
                $widget.css('height', 'auto');
                if (typeof jeedom !== 'undefined' && typeof jeedom.packery !== 'undefined' && typeof jeedom.packery.layout === 'function') {
                    try { jeedom.packery.layout(); } catch (e) {}
                }
            }, 60);
        })();
    </script>
</div>
